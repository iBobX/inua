<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="inua-term">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="icon" type="image/png" href="/icon-192.png">
<title>inua-term</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<style>
  /* inua's fonts, the Latin subsets (scripts/term-web.sh); a font the
     phone has comes first. */
  @font-face { font-family:"Geist Mono"; font-weight:400; src:local("Geist Mono"), url(/vendor/geist-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"Geist Mono"; font-weight:600; src:local("Geist Mono SemiBold"), url(/vendor/geist-mono-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-weight:400; src:local("IBM Plex Sans"), url(/vendor/ibm-plex-sans-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"IBM Plex Sans"; font-weight:600; src:local("IBM Plex Sans SemiBold"), url(/vendor/ibm-plex-sans-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:400; src:local("IBM Plex Mono"), url(/vendor/ibm-plex-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"IBM Plex Mono"; font-weight:600; src:local("IBM Plex Mono SemiBold"), url(/vendor/ibm-plex-mono-latin-600-normal.woff2) format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:400; src:local("JetBrains Mono"), url(/vendor/jetbrains-mono-latin-400-normal.woff2) format("woff2"); }
  @font-face { font-family:"JetBrains Mono"; font-weight:600; src:local("JetBrains Mono SemiBold"), url(/vendor/jetbrains-mono-latin-600-normal.woff2) format("woff2"); }
  /* inua's tokens (design/ui.md), yoru's until the host's theme arrives. */
  :root {
    --app:#0B1012; --panel:#0D1315; --surface:#121A1C; --surface2:#172124;
    --t0:#E7E4DA; --t1:#B3B6AF; --t2:#7F8F8C; --line:#243134;
    --accent:#9FC3C9; --primary:#E7E4DA; --danger:#E0694F; --ok:#7FB89E; --warn:#D9A441;
    --sans:"Zen Kaku Gothic New", "Noto Sans CJK JP", system-ui, sans-serif;
    --title:"IBM Plex Sans", "Zen Kaku Gothic New", system-ui, sans-serif;
    --mono:"Geist Mono", "IBM Plex Mono", "JetBrains Mono", ui-monospace, monospace;
  }
  [hidden] { display:none !important; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--app); color:var(--t0); font:14px var(--sans); overscroll-behavior:none; }
  #app { position:fixed; left:0; right:0; top:0; height:100%; display:flex; flex-direction:column; }
  .tab { flex:1; display:none; flex-direction:column; min-height:0; }
  .tab.shown { display:flex; }
  .icon { width:18px; height:18px; background:currentColor; -webkit-mask:var(--i) center/contain no-repeat; mask:var(--i) center/contain no-repeat; flex:none; }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; touch-action:manipulation; }

  /* A page's head: one line, as the window's column heads: the title
     (IBM Plex Sans 15 px) and a mono readout at the end. */
  header { display:grid; grid-template-columns:36px 1fr 36px; align-items:center; gap:8px; height:calc(env(safe-area-inset-top) + 44px); padding:env(safe-area-inset-top) 8px 0; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); flex:none; }
  header .h1 { grid-column:2; min-width:0; text-align:center; font:15px var(--title); color:var(--t0); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  header button.plain { grid-column:1; grid-row:1; }
  #tab-term { padding-top:env(safe-area-inset-top); }
  /* Room above the phone's gesture bar, while neither the keyboard nor
     the panel is there to take it. */
  #tab-term { padding-bottom:max(env(safe-area-inset-bottom), 12px); }
  #app.typing #tab-term { padding-bottom:0; }
  button.plain { width:36px; height:36px; display:flex; align-items:center; justify-content:center; color:var(--t1); border-radius:2px; flex:none; }
  button.plain:active { background:color-mix(in srgb, var(--accent) 9%, transparent); }
  /* An action at the head's end (New workspace, New session). */
  header button.plain.act { grid-column:3; }

  /* A question with a line to type (a folder, a name; gpg's passphrase):
     a card over the dimmed page, near its top, where a phone's keyboard
     leaves it in view. The line's text is 16 px: smaller, an iPhone
     zooms in on it. */
  .card-over { position:fixed; inset:0; z-index:10; display:flex; justify-content:center; align-items:flex-start; padding:calc(env(safe-area-inset-top) + 56px) 16px 16px; background:color-mix(in srgb, var(--app) 60%, transparent); }
  #secret { z-index:11; }
  .card-over form { width:100%; max-width:420px; margin:0; padding:16px; background:var(--panel); border:1px solid var(--line); border-radius:4px; }
  .card-over .q { font:15px var(--title); color:var(--t0); margin-bottom:12px; }
  .card-over .desc { font:12.5px var(--sans); color:var(--t1); white-space:pre-line; overflow-wrap:anywhere; margin:-4px 0 12px; }
  .card-over .prompt { font:11px var(--mono); letter-spacing:.06em; color:var(--t2); margin-bottom:6px; }
  .card-over input { width:100%; height:40px; padding:0 10px; border:1px solid var(--line); border-radius:2px; background:var(--surface); color:var(--t0); font:16px var(--mono); outline:none; }
  .card-over input:focus { border-color:color-mix(in srgb, var(--accent) 60%, transparent); }
  .card-over .err { min-height:18px; margin-top:6px; font:12px var(--sans); color:var(--danger); }
  .card-over .btns { display:flex; justify-content:flex-end; gap:8px; margin-top:4px; }
  .card-over .btns button { min-height:36px; padding:0 14px; border:1px solid var(--line); border-radius:2px; font:13px var(--sans); color:var(--t1); }
  .card-over .btns button.ok { border-color:var(--accent); background:var(--accent); color:var(--app); }

  /* A notice: a hairline in warn, no fill (the connection's state). */
  .notice { margin:8px 16px 0; padding:6px 10px; border:1px solid var(--warn); border-radius:2px; color:var(--warn); font:11px var(--mono); letter-spacing:.06em; }

  /* Every page keeps one edge, 16 px in, a group's head on it. Where the
     rows go:
     - Folded to one column (a phone), nothing stays selected in a list,
       so a row shows no box: its icon and text go on the head's edge,
       and its tint, when it has one (pressed, waiting, chosen), reaches
       --out past it.
     - In columns side by side (a tablet or a computer: 720 px and wider,
       500 px and taller, as the inua-term window keeps its first column),
       the list keeps a selected row beside what
       it shows: the desktop's rule, the row's box on the head's edge, its
       icon and text inside. */
  .scroll { flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; min-height:0; padding:8px 16px 16px; }
  .scroll > .section:first-child { margin-top:0; }
  /* How far a row's box reaches past the edge: its padding (and its
     border), folded; none in columns. */
  .scroll { --out:10px; }
  .scroll .row { --out:11px; }
  @media (min-width:720px) and (min-height:500px) { .scroll, .scroll .row { --out:0px; } }
  /* Sections as the window's sessions: a mark, a mono label, a hairline. */
  .section { display:flex; align-items:center; gap:8px; min-height:40px; margin:10px 0 6px; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .section .label { font:600 11px var(--mono); letter-spacing:.12em; color:var(--t2); text-transform:uppercase; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  /* A session's Rename, at its head's end. */
  .section button.plain { width:32px; height:32px; margin-right:-8px; color:var(--t2); }
  .section button.plain .icon { width:15px; height:15px; }
  .mark { width:7px; height:7px; border:1px solid var(--t2); border-radius:1px; flex:none; }
  .mark.s-on { border-color:var(--accent); background:var(--accent); }
  .mark.s-warn { border-color:var(--warn); background:var(--warn); }
  .mark.s-ok { border-color:var(--ok); background:var(--ok); }
  .badge { padding:1px 5px; border-radius:2px; background:color-mix(in srgb, var(--warn) 12%, transparent); color:var(--warn); font:11px var(--mono); flex:none; }

  /* A pane's row, as the window's: the kind box, the title, the state. */
  .row { display:flex; align-items:center; gap:10px; min-height:52px; margin:0 calc(-1 * var(--out)) 2px; padding:7px 10px; border:1px solid transparent; border-radius:2px; transition:background 180ms ease-out, border-color 180ms ease-out; }
  .row:active { border-color:color-mix(in srgb, var(--accent) 20%, transparent); background:color-mix(in srgb, var(--accent) 6%, transparent); }
  .row.current { border-color:color-mix(in srgb, var(--accent) 30%, transparent); background:color-mix(in srgb, var(--surface) 90%, var(--primary)); }
  .row.blocked { border-color:color-mix(in srgb, var(--warn) 30%, transparent); background:color-mix(in srgb, var(--warn) 5%, transparent); }
  .kind { width:30px; height:30px; display:flex; align-items:center; justify-content:center; border:1px solid color-mix(in srgb, var(--line) 90%, transparent); border-radius:3px; background:color-mix(in srgb, var(--surface) 60%, transparent); color:var(--t1); flex:none; }
  .row.current .kind { border-color:color-mix(in srgb, var(--accent) 45%, transparent); color:var(--accent); }
  .row .t { flex:1; min-width:0; }
  .row .t > div { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .title { font:14px var(--title); color:var(--t1); }
  .row.current .title, .ws .title { color:var(--t0); }
  .meta { display:flex; gap:8px; align-items:baseline; margin-top:3px; }
  .state { font:10.5px var(--mono); letter-spacing:.06em; color:var(--t2); flex:none; }
  .state.s-on { color:var(--accent); } .state.s-warn { color:var(--warn); } .state.s-ok { color:var(--ok); }
  .dir { font:11px var(--mono); color:var(--t2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .ask { font:11px var(--sans); color:var(--warn); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; min-width:0; }
  .when { font:11px var(--mono); color:var(--t2); flex:none; }
  .ws .title { font-size:15px; }
  .chev { color:var(--t2); }
  .empty { color:var(--t2); padding:40px 0; }

  /* The open pane: its session's panes as one segmented row. */
  /* The panes of the open pane's session, above the keys; the back
     button stays at the left whichever is chosen. */
  #panesbar { display:flex; align-items:center; padding:6px 8px 0; border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent); flex:none; }
  #panesbar[hidden] { display:none; }
  #termback { margin:0; }
  #newpane { margin:0 0 0 8px; }
  #chips { display:flex; overflow-x:auto; flex:1; min-width:0; height:36px; border:1px solid var(--line); border-radius:2px; scrollbar-width:none; }
  #chips::-webkit-scrollbar { display:none; }
  #chips button { display:flex; align-items:center; gap:6px; min-height:34px; padding:0 12px; font:12.5px var(--title); color:var(--t1); white-space:nowrap; flex:none; }
  #chips button + button { border-left:1px solid var(--line); }
  #chips button.on { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); color:var(--t0); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
  #termwrap { flex:1; overflow:hidden; min-height:0; position:relative; touch-action:none; -webkit-touch-callout:none; -webkit-user-select:none; user-select:none; }
  /* A selection made by touch: what to do with it, at the pane's top. */
  #selbar { position:absolute; top:8px; left:50%; transform:translateX(-50%); z-index:2; display:flex; border:1px solid var(--line); border-radius:2px; background:var(--surface); box-shadow:0 4px 14px rgba(0,0,0,.35); }
  #selbar button { display:flex; align-items:center; min-height:36px; padding:0 14px; font:12.5px var(--title); color:var(--t0); white-space:nowrap; }
  #selbar button + button { border-left:1px solid var(--line); }
  #selbar button.plain { width:36px; padding:0; justify-content:center; color:var(--t1); }
  /* The selection's ends, to drag: a drop in the accent under each, as a
     phone's own selection has; the touch area is larger than the drop. */
  .selhandle { position:absolute; z-index:2; width:44px; height:44px; margin-left:-22px; display:flex; justify-content:center; touch-action:none; }
  .selhandle::after { content:""; width:16px; height:16px; margin-top:2px; background:var(--accent); border-radius:0 50% 50% 50%; transform:rotate(45deg); }
  #termwrap[hidden] { display:none; }
  #term { position:absolute; left:8px; top:6px; }
  #bottom { position:absolute; right:8px; bottom:8px; width:36px; height:36px; display:flex; align-items:center; justify-content:center; background:var(--surface); border:1px solid var(--line); border-radius:2px; color:var(--t1); }
  /* The keys a phone's keyboard lacks, as keycaps. */
  #keybar { display:flex; align-items:center; border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent); flex:none; }
  #keys { display:flex; gap:4px; padding:6px 0; margin-left:8px; overflow-x:auto; flex:1; min-width:0; scrollbar-width:none; }
  .barbtn { width:36px; height:36px; margin-right:8px; display:flex; align-items:center; justify-content:center; border:1px solid var(--line); border-radius:2px; background:var(--surface); color:var(--t1); flex:none; }
  #kbtoggle { margin-right:4px; }
  .barbtn { position:relative; z-index:1; transition:box-shadow 150ms ease-out; }
  /* What scrolls under a fixed button is lower: the button casts a
     shadow on it, on the side it went under. */
  .barbtn.over-left { box-shadow:-14px 0 14px -6px rgba(0,0,0,.85); }
  .barbtn.over-right { box-shadow:14px 0 14px -6px rgba(0,0,0,.85); }
  .barbtn:active { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); }
  .barbtn.on { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); color:var(--t0); border-color:color-mix(in srgb, var(--accent) 38%, transparent); }
  /* The key panel, in the keyboard's place: the keys a phone's keyboard
     lacks, in groups, as keycaps. */
  #panel { flex:none; overflow-y:auto; padding:2px 8px max(env(safe-area-inset-bottom), 10px); background:var(--panel); border-top:1px solid var(--line); scrollbar-width:none; }
  #panel::-webkit-scrollbar { display:none; }
  /* Text tabs over a hairline, the current one underlined in the accent. */
  #panel .ptabs { display:flex; gap:8px; margin:0 -8px 2px; padding:0 8px; border-bottom:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  #panel .ptabs button { flex:none; height:auto; padding:10px 8px 9px; border:0; border-radius:0; background:transparent; color:var(--t2); font:600 11px var(--mono); letter-spacing:.14em; transition:color 160ms ease-out, box-shadow 160ms ease-out; }
  #panel .ptabs button.on { color:var(--t0); box-shadow:inset 0 -2px var(--accent); background:transparent; }
  #pinfo .line { margin:0; padding:6px 0; }
  #pinfo { --out:0px; }
  #pinfo .line .label { color:var(--t1); }
  /* Snippets: a keycap of its text, which types it, and ⏎ beside it,
     which sends it; yours with a delete. */
  #psnips .snip { display:flex; gap:6px; margin-top:6px; }
  #psnips .snip button { height:40px; flex:none; }
  #psnips .snip .say { flex:1; min-width:0; padding:0 12px; text-align:left; font:13px var(--sans); color:var(--t0); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #psnips .snip .send, #psnips .snip .del { width:44px; display:flex; align-items:center; justify-content:center; }
  #psnips .snip .send { font:17px var(--mono); color:var(--t1); }
  #psnips .snip .icon { width:15px; height:15px; }
  #psnips .add { width:100%; margin-top:10px; font:12.5px var(--sans); color:var(--t1); }
  #panel .kicker { font:10.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--t2); margin:10px 2px 6px; }
  #panel .grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:6px; }
  #panel button { height:40px; border:1px solid var(--line); border-radius:2px; background:var(--surface); color:var(--t1); font:12px var(--mono); }
  #panel button:active { border-color:color-mix(in srgb, var(--accent) 38%, transparent); background:color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  #panel button.on { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); color:var(--t0); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
  #keys::-webkit-scrollbar { display:none; }
  #keybar[hidden] { display:none; }
  #keys button { min-width:36px; height:36px; padding:0 6px; border:1px solid var(--line); border-radius:2px; background:var(--surface); color:var(--t1); font:11.5px var(--mono); flex:none; }
  #keys button:active { border-color:color-mix(in srgb, var(--accent) 38%, transparent); background:color-mix(in srgb, var(--accent) 6%, var(--surface)); }
  #keys button.on { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); color:var(--t0); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }

  /* The tabs: the panel's ground, a hairline above, the accent on the
     current one. */
  nav { display:flex; background:var(--panel); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom); flex:none; }
  nav.hidden { display:none; }
  nav button { flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding:9px 0 7px; color:var(--t2); position:relative; }
  nav button span.k { font:9px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
  nav button.on { color:var(--accent); }
  /* Overview: the settings language, rows of a label and a readout. */
  .who { font:600 13px var(--mono); color:var(--t0); margin:14px 0 6px; }
  .sysline { display:flex; flex-wrap:wrap; gap:6px 14px; font:11px var(--mono); color:var(--t2); }
  .sysline span { display:flex; align-items:center; gap:5px; }
  .sysline .icon { width:13px; height:13px; }
  .line { position:relative; display:flex; align-items:center; gap:12px; min-height:44px; margin:0 calc(-1 * var(--out)); padding:6px 10px; border-radius:2px; }
  /* The hairline between rows on the content's edge. */
  .line + .line::before { content:""; position:absolute; top:0; left:var(--out); right:var(--out); border-top:1px solid color-mix(in srgb, var(--line) 55%, transparent); }
  .line .label { flex:1; min-width:0; font:13px var(--sans); color:var(--t1); }
  .line .label.mono { font:11px var(--mono); letter-spacing:.06em; }
  .line .label .sub { display:block; font-size:12px; color:var(--t2); margin-top:2px; }
  .line .readout { font:12px var(--mono); color:var(--t1); font-variant-numeric:tabular-nums; text-align:right; }
  .line.go:active { background:color-mix(in srgb, var(--accent) 6%, transparent); }

  /* A number: the digits in mono, − and + as cells behind hairlines. */
  .num { display:flex; height:34px; border:1px solid var(--line); border-radius:2px; background:var(--surface); flex:none; }
  .num button { width:34px; color:var(--t1); font:15px var(--mono); }
  .num span { min-width:56px; display:flex; align-items:center; justify-content:center; border-left:1px solid var(--line); border-right:1px solid var(--line); font:12px var(--mono); color:var(--t0); }
  /* A switch: 36 × 18, 2 px corners, a tint off and the accent on. */
  /* The square switch, as the settings': off is the accent tinted into
     the panel, on is the accent; the knob is the paper with a hairline. */
  .switch { width:40px; height:22px; padding:2px; border-radius:2px; background:color-mix(in srgb, var(--panel) 86%, var(--accent)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 18%, transparent); position:relative; flex:none; transition:background 120ms ease-out; }
  .switch::after { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:2px; background:var(--surface); box-shadow:0 0 0 1px color-mix(in srgb, var(--t0) 18%, transparent), 0 1px 2px color-mix(in srgb, var(--t0) 12%, transparent); transition:left 120ms ease-out; }
  .switch.on { background:var(--accent); box-shadow:none; }
  .switch.on::after { left:21px; }
  .line.column { flex-wrap:wrap; }
  .line.column .label { flex-basis:100%; }
  .choice .label { color:var(--t0); }
  .choice.chosen { background:color-mix(in srgb, var(--surface) 90%, var(--primary)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 30%, transparent); }
  .choice.chosen::before, .choice.chosen + .line::before { display:none; }
  .swatch { display:flex; border:1px solid var(--line); border-radius:2px; overflow:hidden; flex:none; }
  .swatch span { width:12px; height:22px; }
  /* Segmented: the options in one hairline frame, the chosen one tinted. */
  /* Toggle buttons joined in a row, as the settings' (°C/°F): the
     chosen one tinted, ringed in the accent, its text at full strength. */
  .segmented { display:flex; flex:none; max-width:100%; }
  .segmented button { min-height:32px; padding:0 11px; border:1px solid var(--line); border-left-width:0; font:12px var(--mono); color:var(--t1); background:transparent; white-space:nowrap; }
  .segmented button:first-child { border-left-width:1px; border-radius:2px 0 0 2px; }
  .segmented button:last-child { border-radius:0 2px 2px 0; }
  .segmented button.on { background:color-mix(in srgb, var(--accent) 9%, var(--surface)); color:var(--t0); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--accent) 38%, transparent); }
  nav .badge { position:absolute; top:5px; left:calc(50% + 10px); }

  /* A tablet or a computer (wide and tall enough; a phone on its side is
     not): the lists in a column at the left with the tabs under them, the
     open pane beside them, as the inua-term window. */
  @media (min-width:720px) and (min-height:500px) {
    #app { display:grid; grid-template-columns:clamp(280px, 30vw, 360px) minmax(0, 1fr); grid-template-rows:minmax(0, 1fr) auto; }
    #app > .tab { grid-column:1; grid-row:1; min-width:0; border-right:1px solid var(--line); }

  }
  .row, .line.go, button { cursor:pointer; }
  /* A mouse: the hover of design/ui.md, lighter than a press. */
  @media (hover:hover) {
    .row:not(.current):hover { border-color:color-mix(in srgb, var(--accent) 20%, transparent); background:color-mix(in srgb, var(--accent) 6%, transparent); }
    .line.go:hover { background:color-mix(in srgb, var(--accent) 6%, transparent); }
    button.plain:hover { background:color-mix(in srgb, var(--accent) 9%, transparent); }
    .barbtn:hover, #keys button:hover, #panel .grid button:hover, .num button:hover { border-color:color-mix(in srgb, var(--accent) 38%, transparent); background:color-mix(in srgb, var(--accent) 6%, var(--surface)); }
    #chips button:not(.on):hover, .segmented button:not(.on):hover { background:color-mix(in srgb, var(--accent) 6%, transparent); color:var(--t0); }
    nav button:not(.on):hover, #panel .ptabs button:not(.on):hover { color:var(--t1); }
  }
</style>
</head>
<body>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-webgl.js"></script>
<script src="/vendor/addon-unicode-graphemes.js"></script>
<script>/*INUA*/</script>
<script>
"use strict";
// What the server put in: the text in the user's language (keyed by the
// English, as internal/i18n), the forms by number, and the home folder.
const INUA = window.INUA || { strings: {}, one: {}, many: {}, home: "" };
const T = s => INUA.strings[s] || s;
// Tf fills %s and %d in order, or %[n]d by number, as Go's Sprintf.
const Tf = (s, ...a) => { let i = 0; return T(s).replace(/%(?:\[(\d+)\])?[sd]/g, (m, n) => String(a[n ? n - 1 : i++])); };
const Nf = (one, many, n, ...a) => Tf(n === 1 ? (INUA.one[one] || one) : (INUA.many[one] || many), ...a);
const query = new URLSearchParams(location.search);
const token = query.get("t");
const enc = new TextEncoder(), dec = new TextDecoder();
const $ = id => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const icon = name => { const i = el("span", "icon"); i.style.setProperty("--i", `url(/icons/${name}-symbolic.svg)`); return i; };
// The manifest carries the token: a web app on the home screen starts
// with it.
{ const m = el("link"); m.rel = "manifest"; m.href = "/manifest.webmanifest?t=" + encodeURIComponent(token); document.head.append(m); }
for (const e of document.querySelectorAll("[data-t]")) e.textContent = T(e.dataset.t);
for (const e of document.querySelectorAll("[data-ta]")) e.setAttribute("aria-label", T(e.dataset.ta));
document.documentElement.lang = INUA.lang || "en";
const store = { get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
// A tablet or a computer: the lists and the pane side by side (the
// style's columns). A touch screen: the keyboard on the screen.
const wideQuery = matchMedia("(min-width:720px) and (min-height:500px)");
let wide = wideQuery.matches;
const touchScreen = matchMedia("(pointer: coarse)").matches;

// ---- The look: the theme's tokens and the terminals' scheme ----

let look = { theme: "", scheme: "", font: "", themes: [], schemes: [] };
// The phone's own choices; "" follows inua-term on the computer.
const pref = {
  theme: store.get("theme") || "",
  scheme: store.get("scheme") || "",  // "theme": the theme's colours
  font: store.get("tfont") || "",
  cursor: store.get("cursor") || "block",
  blink: store.get("blink") !== "0",
  keys: store.get("keys") ? store.get("keys") !== "0" : touchScreen,  // a computer has the keys
};
function setPref(k, v) { pref[k] = v; store.set({ font: "tfont" }[k] || k, typeof v === "boolean" ? (v ? "1" : "0") : v); applyLook(); }
const lookReady = fetch("/look.json?t=" + token).then(r => r.json()).then(l => { look = l; applyLook(); }).catch(() => {});
const css = name => getComputedStyle(document.documentElement).getPropertyValue("--" + name).trim();
const themeOf = name => look.themes.find(t => t.name === name);
function currentTheme() { return themeOf(pref.theme || look.theme) || look.themes[0]; }
function currentScheme() {
  const name = pref.scheme === "" ? look.scheme : pref.scheme === "theme" ? "" : pref.scheme;
  return look.schemes.find(s => s.name === name) || null;
}
function termFont() { return `"${pref.font || look.font || "Geist Mono"}", ` + css("mono"); }
function termTheme() {
  const s = currentScheme();
  if (!s) return { background: css("app"), foreground: css("t0"), cursor: css("t0"), cursorAccent: css("app") };
  const names = ["black", "red", "green", "yellow", "blue", "magenta", "cyan", "white"];
  const t = { background: s.bg, foreground: s.fg, cursor: s.cursor, cursorAccent: s.bg };
  s.palette.forEach((c, i) => { t[i < 8 ? names[i] : "bright" + names[i - 8][0].toUpperCase() + names[i - 8].slice(1)] = c; });
  return t;
}
function applyLook() {
  const t = currentTheme();
  if (t) for (const [k, v] of Object.entries(t.tokens)) document.documentElement.style.setProperty("--" + k, v);
  let meta = document.querySelector("meta[name=theme-color]");
  if (!meta) { meta = el("meta"); meta.name = "theme-color"; document.head.append(meta); }
  meta.content = css("app");
  fitSoon();  // the key row shown or hidden, a font of another width
  if (term) {
    term.options.theme = termTheme();
    term.options.cursorStyle = pref.cursor;
    term.options.cursorBlink = pref.blink;
    $("termwrap").style.background = termTheme().background;
    const family = termFont();
    if (term.options.fontFamily !== family) {
      document.fonts.load(`12px ${family}`).catch(() => {}).then(() => { term.options.fontFamily = family; fitPane(); });
    }
  }
  render();
}

// ---- The host connection ----

let ws, nextID = 1, pending = new Map(), received = 0, connected = false, since = 0;
// Whether the host makes snapshots: a pane attached at the phone's size
// comes as the host's engine has it, rewrapped, not as its raw output.
let snapshots = false;
let model = { workspaces: [] }, paneMap = new Map();

function send(kind, payload) {
  if (!ws || ws.readyState !== 1) return;
  const b = new Uint8Array(1 + payload.length);
  b[0] = kind; b.set(payload, 1);
  ws.send(b);
}
function request(m) {
  m.id = nextID++;
  send(0, enc.encode(JSON.stringify(m)));
  return new Promise(res => pending.set(m.id, res));
}
function input(s) {
  if (!cur) return;
  const bytes = enc.encode(s), b = new Uint8Array(4 + bytes.length);
  new DataView(b.buffer).setUint32(0, cur, true);
  b.set(bytes, 4);
  send(2, b);
}
// The connection's state, as a notice at the top of each page.
function status(text) {
  for (const n of document.querySelectorAll(".notice")) { n.textContent = text; n.hidden = !text; }
}

function connect() {
  status(T("CONNECTING…"));
  ws = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?t=" + token);
  ws.binaryType = "arraybuffer";
  ws.onmessage = ev => {
    received += ev.data.byteLength;
    const b = new Uint8Array(ev.data);
    if (b[0] === 1) return output(new DataView(ev.data).getUint32(1, true), b.subarray(5));
    if (b[0] !== 0) return;
    const m = JSON.parse(dec.decode(b.subarray(1)));
    if (m.type === "welcome") { snapshots = !!m.snapshot; return welcome(); }
    if (m.type === "reply") { const r = pending.get(m.id); pending.delete(m.id); return r && r(m); }
    if (m.type === "state" && m.state) return setState(m.state);
    if (m.type === "secret" && m.secret) return secretAsked(m.secret);
    if (m.type === "withdraw") return secretGone(m.asked);
    if (m.type === "event" && m.pane === cur && term && m.cols && m.rows) {
      if (m.cols !== term.cols || m.rows !== term.rows) term.resize(m.cols, m.rows);
      panToBottom();
    }
  };
  ws.onclose = () => {
    connected = false; status(T("OFFLINE · RECONNECTING")); setTimeout(connect, 1000); };
}

async function welcome() {
  // The host sends the questions waiting again, after its welcome.
  secrets = []; showSecret();
  status("");
  connected = true; since = Date.now();
  const again = cur;  // a reconnect: attach again
  const r = await request({ type: "state" });
  if (r.state) setState(r.state);
  if (again) open(again, true);
}

function setState(s) {
  model = s.model || {};
  model.workspaces = model.workspaces || [];  // none yet comes as null
  paneMap = new Map((s.panes || []).map(p => [p.id, p]));
  render();
  // The first state after a reload: the pane that was open, open again.
  if (restore) {
    const id = restore;
    restore = 0;
    if (seen("term") && paneMap.has(id)) open(id);
  }
}
let restore = +query.get("pane") || +store.get("pane") || 0;

// ---- What the model says ----

function treePanes(n, out = []) {
  if (!n) return out;
  if (n.pane) out.push(n.pane);
  treePanes(n.a, out); treePanes(n.b, out);
  return out;
}
function sessionPanes(s) { return treePanes(s.tree).map(id => paneMap.get(id)).filter(p => p && !p.exited); }
function where(id) {
  for (const w of model.workspaces) for (const s of w.sessions || [])
    if (treePanes(s.tree).includes(id)) return { w, s };
  return null;
}
function sessionName(w, s) { return s.name || Tf("Session %d", (w.sessions || []).indexOf(s) + 1); }
function wsName(w) {
  const base = (w.dir || "").split("/").filter(Boolean).pop() || T("Workspace");
  // A name of emoji alone says little on a phone: the folder's beside it.
  if (!w.name) return base;
  return /[\p{L}\p{N}]/u.test(w.name) ? w.name : w.name + " " + base;
}
function home(dir) {
  dir = dir || "";
  return INUA.home && (dir === INUA.home || dir.startsWith(INUA.home + "/")) ? "~" + dir.slice(INUA.home.length) : dir;
}
function paneTitle(p) { return p.title || p.command || home(p.dir) || T("Shell"); }
function ago(ms) {
  if (!ms) return "";
  const s = Math.max(0, (Date.now() - ms) / 1000);
  return s < 60 ? T("now") : s < 3600 ? Tf("%dm", Math.floor(s / 60)) : s < 86400 ? Tf("%dh", Math.floor(s / 3600)) : Tf("%dd", Math.floor(s / 86400));
}
// The window's words and marks for an agent's state (internal/termui).
const looks = { working: [T("WORKING"), "s-on"], blocked: [T("NEEDS YOU"), "s-warn"], done: [T("DONE"), "s-ok"], idle: [T("IDLE"), ""] };
function lookOf(p) {
  if (p.restored) return [T("RESTORED"), ""];
  return looks[p.state] || (p.agent ? looks.idle : ["", ""]);
}
function sum(panes) {
  if (panes.some(p => p.state === "blocked")) return "s-warn";
  if (panes.some(p => p.state === "working")) return "s-on";
  return "";
}

function paneRow(p, where) {
  const [word, cls] = lookOf(p);
  const row = el("div", "row" + (p.state === "blocked" ? " blocked" : "") + (p.id === cur ? " current" : ""));
  const kind = el("div", "kind");
  const mark = icon(p.icon || "agent-shell");
  if (p.color) mark.style.color = p.color;
  kind.append(mark);
  row.append(kind);
  const t = el("div", "t");
  t.append(el("div", "title", paneTitle(p)));
  const meta = el("div", "meta");
  if (word) meta.append(el("span", "state " + cls, word));
  if (p.state === "blocked" && p.ask) meta.append(el("span", "ask", p.ask));
  else {
    // Where it is, in the agents' list; a shell's command or folder when
    // its title is not that already. An agent's command is its mark.
    const line = where || (p.agent ? "" : [p.command, home(p.dir)].find(x => x && x !== paneTitle(p)) || "");
    if (line) meta.append(el("span", "dir", line));
  }
  if (meta.childNodes.length) t.append(meta);
  row.append(t);
  if (p.agent && p.since) row.append(el("span", "when", ago(p.since)));
  row.onclick = () => open(p.id);
  return row;
}

// ---- The tabs ----

let tab = null;
let from = store.get("from") || "agents";  // the list the terminal was opened from
// Whether a page shows: the open one; in columns, the terminal always and
// the list it was opened from beside it.
function seen(name) {
  if (wide) return name === "term" || name === (tab === "term" ? from : tab);
  return name === tab;
}
function show(name) {
  if (name === "term" && tab && tab !== "term") { from = tab; store.set("from", from); }
  tab = name;
  const list = tab === "term" ? from : tab;
  for (const t of document.querySelectorAll(".tab")) t.classList.toggle("shown", seen(t.id.slice(4)));
  for (const b of document.querySelectorAll("nav button")) b.classList.toggle("on", b.dataset.tab === list);
  store.set("tab", name);
  if (name === "over") renderOver();
  if (seen("term") && term) requestAnimationFrame(() => { fitPane(); term.refresh(0, term.rows - 1); });
  viewport();
}
for (const b of document.querySelectorAll("nav button")) b.onclick = () => {
  if (b.dataset.tab === "ws" && seen("ws")) wsOpen = null;  // a second tap goes to the top
  if (b.dataset.tab === "over" && seen("over")) overPage = null;
  show(b.dataset.tab); render();
};

function render() {
  renderAgents(); renderWS(); renderTerm(); renderOver();
  const n = [...paneMap.values()].filter(p => p.state === "blocked" && !p.exited).length;
  $("badge").hidden = !n; $("badge").textContent = n;
}

function section(label, cls, count) {
  const head = el("div", "section");
  head.append(el("div", "mark " + (cls || "")), el("span", "label", label));
  if (count) head.append(el("span", "badge", count));
  return head;
}

function renderAgents() {
  const box = $("agents"); box.textContent = "";
  const agents = [...paneMap.values()].filter(p => p.agent && !p.exited);
  const waiting = agents.filter(p => p.state === "blocked").length;
  if (!agents.length) { box.append(el("div", "empty", T("No agent is running."))); return; }
  for (const st of ["blocked", "working", "done", "idle"]) {
    const these = agents.filter(p => (p.state || "idle") === st).sort((a, b) => (b.since || 0) - (a.since || 0));
    if (!these.length) continue;
    const [word, cls] = looks[st];
    box.append(section(word, cls, st === "blocked" ? these.length : 0));
    for (const p of these) {
      const at = where(p.id);
      box.append(paneRow(p, at ? wsName(at.w) + " › " + sessionName(at.w, at.s) : ""));
    }
  }
}

let wsOpen = null;
function renderWS() {
  const box = $("ws"); box.textContent = "";
  const w = wsOpen && model.workspaces.find(w => w.id === wsOpen);
  $("wsback").hidden = !w;
  $("wstitle").textContent = w ? wsName(w) : T("Workspaces");
  $("wsadd").setAttribute("aria-label", w ? T("New session") : T("New workspace"));
  if (!w) {
    wsOpen = null;
    for (const w of model.workspaces) {
      const panes = (w.sessions || []).flatMap(sessionPanes);
      if (!panes.length) continue;
      const row = el("div", "row ws");
      row.append(el("div", "mark " + sum(panes)));
      const t = el("div", "t");
      t.append(el("div", "title", wsName(w)));
      const n = (w.sessions || []).length;
      const meta = el("div", "meta");
      meta.append(el("span", "dir", `${home(w.dir)} · ${Nf("%d session", "%d sessions", n, n)} · ${Nf("%d pane", "%d panes", panes.length, panes.length)}`));
      t.append(meta);
      row.append(t);
      const waiting = panes.filter(p => p.state === "blocked").length;
      if (waiting) row.append(el("span", "badge", waiting));
      const chev = icon("go-next"); chev.classList.add("chev");
      row.append(chev);
      row.onclick = () => { wsOpen = w.id; renderWS(); $("ws").scrollTop = 0; };
      box.append(row);
    }
    return;
  }
  for (const s of w.sessions || []) {
    const panes = sessionPanes(s);
    if (!panes.length) continue;
    const head = section(sessionName(w, s), sum(panes), panes.filter(p => p.state === "blocked").length);
    const rename = el("button", "plain");
    rename.append(icon("document-edit"));
    rename.setAttribute("aria-label", T("Rename the session"));
    rename.onclick = () => renameSession(w, s);
    head.append(rename);
    box.append(head);
    for (const p of panes) box.append(paneRow(p));
  }
}
$("wsback").onclick = () => { wsOpen = null; renderWS(); };
// Back (in columns, Close): the pane goes back to the desktop, and the
// list shows again.
$("termback").addEventListener("pointerdown", e => e.preventDefault());
$("termback").onclick = () => {
  if (cur) leave(cur);
  cur = null;
  store.set("pane", "");
  if (term) { term.dispose(); term = null; }
  showPanel(false);
  show(from === "term" ? "agents" : from);
  render();
};
$("overback").onclick = () => { overPage = null; renderOver(); $("over").scrollTop = 0; };

// ---- New workspaces, sessions and panes; a session's name ----

// ask asks for a line of text (a folder, a name) in a card over the
// page; done gets it and gives back what went wrong, which keeps the card
// open to try again.
function ask(question, value, action, done) {
  const box = $("ask"), f = box.querySelector("form"), line = f.querySelector("input"), err = f.querySelector(".err");
  f.querySelector(".q").textContent = question;
  f.querySelector(".ok").textContent = action;
  line.value = value; err.textContent = "";
  box.hidden = false;
  line.focus(); line.setSelectionRange(value.length, value.length);
  const close = () => { box.hidden = true; line.blur(); f.onsubmit = null; };
  f.querySelector(".cancel").onclick = close;
  box.onclick = e => { if (e.target === box) close(); };

// the host withdraws the question everywhere else.
let secrets = [];

  const box = $("secret"), f = box.querySelector("form"), line = f.querySelector("input");

  if (!s) {

    box.hidden = true;

let cur = null, term = null, st = {};

function renderTerm() {

async function open(id, again) {

// The host's engine answers the program's queries (which terminal, which

// them and says nothing.

    { final: "n" }, { prefix: "?", final: "n" },                                // status, cursor position
    { intermediates: "$", final: "p" }, { prefix: "?", intermediates: "$", final: "p" },  // modes
    { final: "t" },                                                             // window reports

    rows: Math.max(4, Math.floor((wrap.clientHeight - 2 * padY) / c.h)),
    cell_w: Math.round(c.w * devicePixelRatio), cell_h: Math.round(c.h * devicePixelRatio),

// set at once, it moved the old lines a frame before the new were drawn,

}

function scrollLines(lines) {

  $("kbtoggle").classList.toggle("on", typingHere());
  if (keyboard) {
    // Its height, for the panel; and the keyboard up closes the panel.
    keyboardHeight = Math.round(tallest - h);
    store.set("kbh", keyboardHeight);
    if (panelOpen) showPanel(false);
  }
  $("app").style.height = h + "px";
  $("app").style.top = (vv ? vv.offsetTop : 0) + "px";
  // On a phone the terminal is a page of its own: no tabs under it.
  $("nav").classList.toggle("hidden", !wide && tab === "term");
  // In columns, Back closes the pane.
  $("termback").querySelector(".icon").style.setProperty("--i", `url(/icons/${wide ? "window-close" : "go-previous"}-symbolic.svg)`);
  $("termback").setAttribute("aria-label", wide ? T("Close") : T("Back"));
  $("app").classList.toggle("typing", keyboard || panelOpen);

  if (!keyboard) window.scrollTo(0, 0);
  fitSoon();
}
if (window.visualViewport) { visualViewport.addEventListener("resize", viewport); visualViewport.addEventListener("scroll", viewport); }
addEventListener("resize", viewport);
addEventListener("orientationchange", () => setTimeout(viewport, 300));
// iOS does not always say when the keyboard folds: look again after.
document.addEventListener("focusout", () => setTimeout(viewport, 350));
document.addEventListener("focusin", () => setTimeout(viewport, 350));
setInterval(() => (wide || tab !== "term") && render(), 30000);  // the "3m" ago
// A tablet turned, a window made narrow: the other layout.
wideQuery.addEventListener("change", () => { wide = wideQuery.matches; show(tab); render(); });

show(query.get("tab") || store.get("tab") || "agents");
connect();
poll();
</script>
</body>
</html>
