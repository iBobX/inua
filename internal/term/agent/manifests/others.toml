# Agents known by their process: their state comes from what they report,
# their title and the bell until a manifest of their own says more.
[[agent]]
type = "aider"
name = "Aider"
color = "#14b014"
process = ["aider"]

[[agent.state]]
state = "blocked"
lines = 4
any = ["(Y)es/(N)o"]

