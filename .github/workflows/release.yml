# Builds the Linux releases (amd64, arm64) with GoReleaser and publishes
# them on GitHub when a version is tagged: git tag v0.1.2 && git push --tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog
      - uses: actions/setup-go@v5
        with:
          # The newest Go, not go.mod's minimum: releases get the standard
          # library's latest security fixes.
          go-version: stable
          check-latest: true
      # The GTK views' tests load GTK's libraries, found through
      # pkg-config, though they draw nothing on a screen.
      - name: Test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libgtk-4-dev
      - name: Tests
        run: go test ./...
      # inua-term's engine: libghostty-vt at its pinned commit, with inua's
      # shim, for each machine (scripts/libghostty.sh).
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - name: inua-term's engine
        run: |
          ZIG_TARGET=x86_64-linux-gnu scripts/libghostty.sh lib/amd64
          ZIG_TARGET=aarch64-linux-gnu scripts/libghostty.sh lib/arm64
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # inua-mail's Google sign-in (docs/mail.md, "OAuth client IDs")
          INUA_GOOGLE_CLIENT_SECRET: ${{ secrets.INUA_GOOGLE_CLIENT_SECRET }}
