# Publishes website/ to Cloudflare Pages (inua.one) on every push to master
# that changes it, with scripts/install.sh as /install.sh.
#
# Once, in Cloudflare: a Pages project named inua (Workers & Pages → Create
# → Pages → Direct Upload, or `npx wrangler pages project create inua
# --production-branch master`), with inua.one and www.inua.one as its
# custom domains, and a redirect rule from www.inua.one to inua.one. In
# this repository's secrets: CLOUDFLARE_API_TOKEN (a token with Account →
# Cloudflare Pages → Edit) and CLOUDFLARE_ACCOUNT_ID.
name: Website

on:
  push:
    branches: [master]
    paths: ["website/**", "scripts/install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://inua.one
    steps:
      - uses: actions/checkout@v4
      - name: Site
        run: |
          mkdir _site
          cp -r website/. _site/
          cp scripts/install.sh _site/install.sh
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=inua --branch=master
