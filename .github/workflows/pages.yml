# Publishes website/ to GitHub Pages (inua.lyric.im) on every push to master
# that changes it, with scripts/install.sh as /install.sh. The domain is set
# in the repository's Pages settings.
name: Website

on:
  push:
    branches: [master]
    paths: ["website/**", "scripts/install.sh", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Site
        run: |
          mkdir _site
          cp -r website/. _site/
          cp scripts/install.sh _site/install.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
