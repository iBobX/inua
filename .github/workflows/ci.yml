name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install check dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc make python3 python3-gi dbus-daemon pass gnupg \
            gir1.2-secret-1 libturbojpeg0 hyprland \
            blueprint-compiler gir1.2-gtk-4.0
      - name: Go formatting
        run: |
          unformatted=$(git ls-files '*.go' | xargs gofmt -l)
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Check generated layouts
        run: |
          make generate
          git add --intent-to-add -- ui/
          git diff --exit-code -- ui/
      - name: Check the translation template and catalogs
        run: |
          make i18n
          git diff --exit-code -- po/ internal/i18n/locales/
      - name: Tests and vet
        run: make test
      - name: Build all programs
        run: make build
