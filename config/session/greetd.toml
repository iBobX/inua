# scripts/install-session.sh writes this with the greeter account and VT
# of the greetd package installed: _greetd on Debian and Ubuntu, greeter
# on Arch, greetd on Fedora; the VT of the config it replaces, else 7.
[terminal]
vt = 7

[default_session]
command = "/usr/bin/tuigreet --time --sessions /usr/share/wayland-sessions --cmd /usr/local/bin/inua-session"
user = "_greetd"
