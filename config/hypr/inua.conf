# Generated by inua from ~/.config/inua/config.toml; changes
# here are overwritten. Use inua's settings window, or edit config.toml and
# run `inua config apply`. hyprland.conf sources this file after its own
# input settings, so these win.

# inua's lock screen holds the session lock. If the shell stops while the
# screen is locked, the screen stays locked; inua-shell, started again,
# takes the lock over and shows its lock screen.
misc {
    allow_session_lock_restore = true
}

# inua's light apps (Clock, Weather, Stocks, Calculator, Calendar, Color
# Picker, System Monitor, Viewer) float at their own size; so does Mail's
# composer, which has a class of its own (io.github.lyricat.Inua.Mail.Compose).
windowrule {
    name = inua-light-apps
    match:class = ^(io\.github\.lyricat\.Inua\..+)$
    float = yes
    center = yes
}

# The composer's class comes once Hyprland has sized it as Mail's, tiled:
# its size is given here.
windowrule {
    name = inua-mail-compose
    match:class = ^(io\.github\.lyricat\.Inua\.Mail\.Compose)$
    size = 1000 720
}

# Files is a normal window: tiled like other apps.
windowrule {
    name = inua-files
    match:class = ^(io\.github\.lyricat\.Inua\.Files)$
    tile = yes
}

# So is the terminal, inua-term.
windowrule {
    name = inua-term
    match:class = ^(io\.github\.lyricat\.Inua\.Term)$
    tile = yes
}

# And Mail, inua-mail.
windowrule {
    name = inua-mail
    match:class = ^(io\.github\.lyricat\.Inua\.Mail)$
    tile = yes
}

# Their dialogs (inua-term's first-start guide) float over them.
windowrule {
    name = inua-dialogs
    match:class = ^(io\.github\.lyricat\.Inua\..+)$
    match:modal = true
    float = yes
    center = yes
}

# The portal's dialogs (choosing a file or a folder for an app) are another
# program's windows: floated and centred, over the app that asked rather
# than tiled behind it.
windowrule {
    name = inua-portal-dialogs
    match:class = ^(xdg-desktop-portal-gtk|xdg-desktop-portal-gnome|org\.freedesktop\.impl\.portal\..+)$
    float = yes
    center = yes
}

# Nothing set in inua; hyprland.conf decides.

# While inua's settings window records a shortcut, no other is active.
submap = inua-record
bind = SUPER CTRL ALT, Escape, submap, reset
submap = reset
